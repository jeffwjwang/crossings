<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiwi Streets Crossword</title>
<style>
:root{--ink:#16130f;--paper:#efe3c8;--accent:#ffcf33;--sel:#fff0b0;--ok:#bfe8b5;--okd:#1e5e22;--bad:#c62828;--hint:#0d47a1;--panel:#fffaf0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1822;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100%}
header{background:#1b1822;color:#fff;padding:10px 16px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;letter-spacing:.3px}
#sub{font-size:19px;color:#ffd96a;font-style:italic}
#progress{margin-left:auto;font-size:18px;color:#e8e3f0}
main{flex:1;display:flex;min-height:0}
#mapwrap{position:relative;flex:1;min-width:0;background:#15131c;overflow:hidden;touch-action:none}
#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#mapbtns{position:absolute;top:10px;left:10px;display:flex;gap:8px}
#mapbtns button{font-size:17px;padding:8px 12px;border-radius:10px;border:2px solid #fff;background:rgba(20,18,28,.85);color:#fff;cursor:pointer;min-width:44px;min-height:44px}
.attrib{position:absolute;right:6px;bottom:4px;font-size:12px;color:#ddd;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px}
.attrib a{color:#fff}
#card{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;width:min(560px,calc(100% - 24px));background:#fffaf0;border:3px solid #8a6d2b;border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:18px;line-height:1.4;animation:pop .35s ease}
#card h3{margin:0 0 6px;font-size:20px;color:#6b4e12}
#card .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
#card button,.big{font-size:18px;padding:10px 16px;border-radius:10px;border:2px solid var(--ink);background:var(--accent);color:var(--ink);font-weight:700;cursor:pointer;min-height:48px}
#card button.ghost{background:#fff}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#panel{width:430px;max-width:100%;background:var(--panel);display:flex;flex-direction:column;gap:10px;padding:12px;overflow:auto}
#cluebox{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px}
#clueMeta{font-size:16px;font-weight:700;color:#5a4a2a;text-transform:uppercase;letter-spacing:.5px}
#clueText{font-size:21px;line-height:1.35;margin:6px 0 10px;min-height:2.7em}
#row{display:flex;flex-wrap:wrap;gap:5px}
#row div{width:38px;height:46px;border:2.5px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:#fff;cursor:pointer}
#row div.act{background:var(--accent)}
#row div.lock{background:var(--ok);border-color:var(--okd)}
#row div.bad{color:var(--bad);border-color:var(--bad)}
#row div.hint{color:var(--hint)}
#row.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
#msg{font-size:17px;min-height:1.4em;margin-top:8px;font-weight:600}
#actions{display:flex;gap:8px;margin-top:10px}
#actions button{flex:1}
#kb{display:flex;flex-direction:column;gap:6px}
#kb .r{display:flex;gap:5px;justify-content:center}
#kb button{flex:1;max-width:44px;min-height:54px;font-size:22px;font-weight:800;border-radius:9px;border:2px solid #333;background:#fff;color:#111;cursor:pointer;padding:0}
#kb button.wide{max-width:90px;flex:1.8;font-size:18px}
#kb button:active{background:var(--accent)}
details{background:#fff;border:2px solid #bbb;border-radius:12px;padding:8px 12px;font-size:17px}
summary{font-weight:700;cursor:pointer;font-size:18px}
#clueList{padding-left:24px;margin:8px 0}
#clueList li{margin:6px 0;cursor:pointer;line-height:1.35}
#clueList li.cur{background:var(--sel);border-radius:6px}
#clueList li.done{color:#2e6b31}
#clueList li.locked{color:#777;cursor:default}
#finish{position:fixed;inset:0;background:rgba(10,8,16,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#finish[hidden]{display:none}
#finbox{background:#fffaf0;border:4px solid #8a6d2b;border-radius:18px;padding:20px;max-width:520px;width:100%;font-size:19px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#finbox h2{margin:4px 0 8px;font-size:28px}
#finbox .place{font-size:30px;font-weight:800;color:#6b4e12;margin:6px 0 12px}
#share{width:100%;font-size:18px;font-family:inherit;height:150px;border:2px solid #333;border-radius:10px;padding:8px;resize:none;text-align:left}
#finbox .row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* svg */
.road{fill:none;stroke:#b39a6c;stroke-linecap:round;stroke-linejoin:round}
.park{fill:#c9d8a4;stroke:#9fb47a;stroke-width:1}
.wpath{fill:none;stroke:#e9c46a;stroke-width:4;stroke-dasharray:6 7;stroke-linecap:round;opacity:.9}
.wpath.solved{stroke:#2e7d32;stroke-dasharray:none;stroke-width:5;opacity:.75}
.wpath.sel{stroke:#ff9f1c;stroke-dasharray:none;stroke-width:9;opacity:1}
.whit{fill:none;stroke:transparent;stroke-width:34;stroke-linecap:round;cursor:pointer;pointer-events:stroke}
.cell circle{fill:#fffdf6;stroke:#16130f;stroke-width:1.8}
.cell.sel circle{fill:var(--sel);stroke:#ff8c00;stroke-width:2.4}
.cell.act circle{fill:var(--accent);stroke:#16130f;stroke-width:3}
.cell.lock circle{fill:var(--ok);stroke:var(--okd)}
.cell text{font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#111;pointer-events:none;font-family:system-ui,Arial,sans-serif}
.cell text.hint{fill:var(--hint)}
.cell text.bad{fill:var(--bad)}
.cell .num{font-size:6.5px;font-weight:700;fill:#5a3d00}
.cell{cursor:pointer}
.lbl{font-size:13px;font-weight:800;fill:#1d3b1f;stroke:#fffaf0;stroke-width:4;paint-order:stroke;text-anchor:middle;pointer-events:none}
@media (max-width:860px){
 main{flex-direction:column}
 header{padding:8px 12px;gap:2px 10px}
 #card{position:fixed;left:0;right:0;bottom:0;transform:none;width:100%;border-radius:16px 16px 0 0;z-index:5;font-size:17px;animation:none}
 #mapbtns button{font-size:16px;min-height:42px;padding:6px 10px}
 #mapwrap{flex:none;height:42vh;min-height:260px}
 #msg{min-height:0;margin-top:4px} #cluebox{padding:10px} #kb button{min-height:50px}
 #panel{width:100%;padding:10px}
 header h1{font-size:20px} #sub{font-size:16px} #progress{font-size:15px;margin-left:0;width:100%}
 #clueText{font-size:19px;min-height:0}
 #row div{width:34px;height:42px;font-size:23px}
}
</style>
</head>

function animHoles(now){let busy=false; for(const h of holeEls){const t=Math.min(1,Math.max(0,(now-h.t0)/h.dur)); const e=1-Math.pow(1-t,3); h.c.setAttribute('r',(h.r*e).toFixed(1)); if(t<1) busy=true;} if(busy) requestAnimationFrame(animHoles);}
function lightWord(k,r,animate){const cs=W[k].cells; cs.forEach((c,i)=>addHole(C[c].x,C[c].y,r,animate?i*110:0,animate?900:1)); requestAnimationFrame(animHoles);}
// word paths, cells, labels
const pathG=$('paths'), cellG=$('cells'), lblG=$('labels');
const wp=W.map((w,k)=>{const g=el('g',{},pathG); const v=el('polyline',{points:pts(w.path),class:'wpath'},g); const h=el('polyline',{points:pts(w.path),class:'whit'},g); h.addEventListener('click',ev=>{if(!dragMoved) select(k,0)}); return {g,v};});
const firstOf=W.map(w=>w.cells[0]);
const ce=C.map((c,i)=>{const g=el('g',{class:'cell'},cellG); el('circle',{cx:c.x,cy:c.y,r:R*.96},g); const t=el('text',{x:c.x,y:c.y+.5,'font-size':13},g);
 const nums=W.map((w,k)=>w.cells[0]===i?k+1:0).filter(Boolean); if(nums.length){el('text',{x:c.x-R*.62,y:c.y-R*.55,class:'num'},g).textContent=nums.join('/');}
 g.addEventListener('click',ev=>{ev.stopPropagation(); if(dragMoved) return; const os=owners[i].filter(discovered); if(!os.length) return; let k=os.includes(cur)&&W[cur].cells[act]===i&&os.length>1?os.find(o=>o!==cur):(os.includes(cur)?cur:os[0]); select(k,W[k].cells.indexOf(i));});
 return {g,t};});
const placed=[];
function label(k){const w=W[k]; const p=w.path; const txt=w.street; const half=txt.length*3.9; let best=null;
 for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1]; const bl=Math.hypot(b[0]-a[0],b[1]-a[1]); if(bl<1) continue; const ux=(b[0]-a[0])/bl, uy=(b[1]-a[1])/bl;
  for(let f=0.1;f<=0.9;f+=0.2) for(const side of [1,-1]) for(const off of [17,24]){
   const mx=a[0]+(b[0]-a[0])*f-uy*off*side, my=a[1]+(b[1]-a[1])*f+ux*off*side;
   const samples=[]; for(let s=-half;s<=half;s+=6) samples.push([mx+ux*s,my+uy*s]);
   let cost=0; for(const q of samples){ for(const c of C){const d=Math.hypot(q[0]-c.x,q[1]-c.y); if(d<R+7) cost+=10*(R+7-d);} for(const pl of placed){const d=Math.hypot(q[0]-pl[0],q[1]-pl[1]); if(d<9) cost+=6*(9-d);} }
   cost+=off*0.2; if(bl<2*half) cost+= (2*half-bl)*0.3;
   if(!best||cost<best.cost) best={cost,mx,my,ang:Math.atan2(uy,ux)*180/Math.PI,samples};
  }}
 let ang=best.ang; if(ang>90)ang-=180; if(ang<-90)ang+=180; placed.push(...best.samples);
 const t=el('text',{class:'lbl',transform:`translate(${best.mx.toFixed(1)},${best.my.toFixed(1)}) rotate(${ang.toFixed(1)})`,dy:'4'},lblG); t.textContent=mask(w.street); t.dataset.k=k; }
// ---------- view
let vb=[bx0,by0,bx1-bx0,by1-by0], anim=null;
function setVB(v){vb=v; svg.setAttribute('viewBox',v.map(n=>n.toFixed(1)).join(' '));}
function goVB(t,ms=500){const s=vb.slice(), t0=performance.now(); cancelAnimationFrame(anim); const step=now=>{const u=Math.min(1,(now-t0)/ms), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2; setVB(s.map((x,i)=>x+(t[i]-x)*e)); if(u<1) anim=requestAnimationFrame(step);}; anim=requestAnimationFrame(step);}
function boxOf(ks,pad){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; ks.forEach(k=>W[k].cells.forEach(c=>{x0=Math.min(x0,C[c].x);y0=Math.min(y0,C[c].y);x1=Math.max(x1,C[c].x);y1=Math.max(y1,C[c].y);})); return [x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad];}
function fitDiscovered(){const ks=W.map((_,k)=>k).filter(discovered); goVB(boxOf(ks,finished?160:70));}
function pxPerM(v){const r=svg.getBoundingClientRect(); return Math.min(r.width/v[2], r.height/v[3]);}
function focusWord(k){ let v=boxOf([k],45); const min=Math.max(220, 34/ (pxPerM([0,0,1,1])||1)); // keep cells >= ~34px
 const r=svg.getBoundingClientRect(); const need=r.width>700?30:36; // px per cell diameter
 const fitAll=boxOf(W.map((_,i)=>i).filter(discovered),70);
 if(pxPerM(fitAll)*D>=need){ goVB(fitAll); return; }
 // zoom so a cell is ~need px, centred on word
 const cx=v[0]+v[2]/2, cy=v[1]+v[3]/2; const s=need/D; let w=r.width/s, h=r.height/s; w=Math.max(w,v[2]); h=Math.max(h,v[3]); goVB([cx-w/2,cy-h/2,w,h]); }
$('zoomAll').onclick=()=>fitDiscovered();
const zoom=f=>{const cx=vb[0]+vb[2]/2, cy=vb[1]+vb[3]/2; goVB([cx-vb[2]*f/2,cy-vb[3]*f/2,vb[2]*f,vb[3]*f],250);};
$('zIn').onclick=()=>zoom(.7); $('zOut').onclick=()=>zoom(1.4);
// drag to pan
let drag=null, dragMoved=false;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,v:vb.slice()}; dragMoved=false;});
svg.addEventListener('pointermove',e=>{if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>6) dragMoved=true; if(dragMoved){const s=pxPerM(drag.v); setVB([drag.v[0]-dx/s,drag.v[1]-dy/s,drag.v[2],drag.v[3]]);}});
window.addEventListener('pointerup',()=>{drag=null; setTimeout(()=>dragMoved=false,0);});
svg.addEventListener('wheel',e=>{e.preventDefault(); zoom(e.deltaY>0?1.15:.87);},{passive:false});
// ---------- keyboard
const kb=$('kb');
['QWERTYUIOP','ASDFGHJKL','ZXCVBNM⌫'].forEach(row=>{const r=document.createElement('div'); r.className='r'; [...row].forEach(ch=>{const b=document.createElement('button'); b.textContent=ch; if(ch==='⌫'){b.className='wide'; b.setAttribute('aria-label','Delete');} b.onclick=()=>ch==='⌫'?back():type(ch); r.appendChild(b);}); kb.appendChild(r);});
document.addEventListener('keydown',e=>{ if(e.ctrlKey||e.metaKey||e.altKey) return; if(!$('finish').hidden) return;
 if(/^[a-zA-Z]$/.test(e.key)){type(e.key.toUpperCase()); e.preventDefault();}
 else if(e.key==='Backspace'){back(); e.preventDefault();}
 else if(e.key==='ArrowRight'||e.key==='ArrowDown'){move(1); e.preventDefault();}
 else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){move(-1); e.preventDefault();}
 else if(e.key==='Enter'){check(true); e.preventDefault();}
 else if(e.key==='Tab'){nextWord(e.shiftKey?-1:1); e.preventDefault();}});
// ---------- logic
function select(k,i){ if(!discovered(k)) return; cur=k; act=Math.max(0,Math.min(W[k].cells.length-1,i??0)); if(i==null) act=firstOpen(k,0); $('card').hidden=true; render(); focusWord(k);}
function firstOpen(k,from){const cs=W[k].cells; for(let j=from;j<cs.length;j++) if(!locked(cs[j])&&!st.entry[cs[j]]) return j; for(let j=0;j<cs.length;j++) if(!locked(cs[j])&&!st.entry[cs[j]]) return j; return Math.min(from,cs.length-1);}
function move(d){const cs=W[cur].cells; let j=act; do{j+=d;}while(j>=0&&j<cs.length&&locked(cs[j])); if(j>=0&&j<cs.length) act=j; render();}
let badMarks=new Set();
function type(ch){ if(st.solved[cur]||finished) return; if(!st.start){st.start=Date.now();} const cs=W[cur].cells; if(locked(cs[act])){move(1); if(locked(cs[act])) return;}
 st.entry[cs[act]]=ch; st.hinted[cs[act]]=false; badMarks.delete(cs[act]); $('msg').textContent='';
 let j=act+1; while(j<cs.length&&locked(cs[j])) j++; if(j<cs.length) act=j;
 save(); render(); if(cs.every(c=>st.entry[c])) check(false);}
function back(){ if(st.solved[cur]) return; const cs=W[cur].cells; if(!locked(cs[act])&&st.entry[cs[act]]){st.entry[cs[act]]='';} else { let j=act-1; while(j>=0&&locked(cs[j])) j--; if(j>=0){act=j; st.entry[cs[j]]='';} } badMarks.delete(cs[act]); save(); render(); }
function check(explicit){ const w=W[cur], cs=w.cells; if(st.solved[cur]) return;
 const got=cs.map(c=>st.entry[c]||'').join('');
 if(got===w.answer){ solve(cur); return; }
 if(explicit||got.length===cs.length){ cs.forEach(c=>{if(st.entry[c]&&st.entry[c]!==C[c].a) badMarks.add(c);});
  const r=$('row'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake');
  $('msg').style.color='#c62828'; $('msg').textContent= got.length<cs.length? 'Keep going — some letters are still empty.' : 'Not quite. Red letters are wrong. Try again, or tap 💡 Hint.'; render(); }}
function hint(){ if(st.solved[cur]||finished) return; if(!st.start) st.start=Date.now(); const cs=W[cur].cells; let j=-1;
 const okAt=x=>locked(cs[x])||st.entry[cs[x]]===C[cs[x]].a;
 if(!okAt(act)) j=act; else { for(let x=0;x<cs.length;x++) if(!okAt(x)){j=x;break;} }
 if(j<0) return; st.entry[cs[j]]=C[cs[j]].a; st.hinted[cs[j]]=true; badMarks.delete(cs[j]); st.hints[cur]++; act=j; save(); render(); if(cs.every(c=>st.entry[c])) check(false);}
$('hintBtn').onclick=hint; $('checkBtn').onclick=()=>check(true);
function nextWord(d=1){ for(let s=1;s<=W.length;s++){const k=(cur+d*s+W.length*5)%W.length; if(discovered(k)&&!st.solved[k]){select(k);return;}} }
let discoveredCount=0;
function solve(k,quiet){ st.solved[k]=true; W[k].cells.forEach(c=>{st.entry[c]=C[c].a; badMarks.delete(c);}); save();
 lightWord(k,95,!quiet); label(k);
 if(!quiet){ $('msg').style.color='#2e6b31'; $('msg').textContent=allDone()?'Correct! The whole map is revealed.':'Correct! New streets appear on the map.'; showCard(k); }
 if(allDone()) { finish(quiet); } else if(!quiet) { const before=cur; render(); setTimeout(()=>{ fitDiscovered(); },350); }
 render(); }
function showCard(k){ const f=DATA.facts[W[k].street]||{}; const n=st.solved.filter(Boolean).length;
 const meets=(f.meets||[]).slice(0,3).map(mask); const card=$('card');
 card.innerHTML=`<h3>🔍 Discovery ${n} of ${W.length}</h3><div>You uncovered <b>${mask(W[k].street)}</b>. ${f.len?`It is about ${f.len} m long`:''}${meets.length?` and meets ${meets.join(', ').replace(/, ([^,]*)$/,' and $1')}`:''}.</div><div style="margin-top:6px">${GENERIC[(n-1)%GENERIC.length]}</div><div class="row">${allDone()?'':'<button class="ghost" id="cardClose">Close</button><button id="cardNext">Next street ▶</button>'}</div>`;
 card.hidden=false; const c1=$('cardClose'), c2=$('cardNext'); if(c1) c1.onclick=()=>card.hidden=true; if(c2) c2.onclick=()=>{card.hidden=true; nextWord(1);} }
function finish(quiet){ finished=true; if(!st.end) st.end=Date.now(); save();
 const fog=$('fog'); fog.style.transition='opacity 2.2s ease'; requestAnimationFrame(()=>fog.style.opacity=0);
 lblG.querySelectorAll('text').forEach(t=>t.textContent=W[+t.dataset.k].street);
 $('sub').textContent='Today you explored: '+LOCATION; $('sub').style.fontStyle='normal';
 $('card').hidden=true; goVB(boxOf(W.map((_,i)=>i),70),1200);
 const hints=st.hints.reduce((a,b)=>a+b,0), mins=st.start?Math.max(1,Math.round((st.end-st.start)/60000)):null;
 const squares=W.map((_,k)=>st.hints[k]?'🟨':'🟩').join('');
 const share=`Kiwi Streets Crossword #1\n🗺️ ${W.length}/${W.length} streets explored\n${squares}\n💡 ${hints} hint${hints===1?'':'s'}${mins?` · ⏱ ${mins} min`:''}\nWhere were you today? 🔍`;
 $('share').value=share; $('finStats').textContent=`${W.length} streets · ${hints} hint${hints===1?'':'s'}${mins?` · about ${mins} min`:''}`;
 setTimeout(()=>{$('finish').hidden=false;}, quiet?0:1800); render(); }
$('copyBtn').onclick=async()=>{const t=$('share'); try{await navigator.clipboard.writeText(t.value);}catch(e){t.select(); document.execCommand('copy');} $('copied').textContent='Copied! Paste it to your family or friends.';};
$('closeFin').onclick=()=>{$('finish').hidden=true;};
$('resetBtn').onclick=()=>{ if(confirm('Start this puzzle again from the beginning?')){ try{localStorage.removeItem(SAVE)}catch(e){} location.reload(); } };
// ---------- render
function render(){
 const done=st.solved.filter(Boolean).length; $('progress').textContent=`${done} of ${W.length} streets explored`;
 W.forEach((w,k)=>{ const d=discovered(k); wp[k].g.style.display=d?'':'none'; wp[k].v.setAttribute('class','wpath'+(st.solved[k]?' solved':'')+(k===cur&&!finished?' sel':'')); if(k===cur&&!st.solved[k]) wp[k].v.setAttribute('marker-end','url(#arrow)'); else wp[k].v.removeAttribute('marker-end'); });
 C.forEach((c,i)=>{ const vis=owners[i].some(discovered); const e=ce[i]; e.g.style.display=vis?'':'none'; if(!vis) return;
  const inCur=W[cur].cells.includes(i), isAct=inCur&&W[cur].cells[act]===i&&!st.solved[cur]&&!finished;
  e.g.setAttribute('class','cell'+(locked(i)?' lock':'')+(inCur&&!finished?' sel':'')+(isAct?' act':''));
  e.t.textContent=st.entry[i]||''; e.t.setAttribute('class',(st.hinted[i]?'hint':'')+(badMarks.has(i)?' bad':'')); });
 // panel
 const w=W[cur]; $('clueMeta').textContent=`Street ${cur+1} · ${w.cells.length} letters`+(st.solved[cur]?' · solved ✔':'');
 $('clueText').textContent=w.clue;
 const row=$('row'); row.innerHTML=''; w.cells.forEach((c,j)=>{const d=document.createElement('div'); d.textContent=st.entry[c]||''; d.className=(j===act&&!st.solved[cur]?'act ':'')+(locked(c)?'lock ':'')+(badMarks.has(c)?'bad ':'')+(st.hinted[c]?'hint':''); d.onclick=()=>{act=j; render();}; row.appendChild(d);});
 const ol=$('clueList'); ol.innerHTML=''; W.forEach((x,k)=>{const li=document.createElement('li'); const d=discovered(k);
  li.className=(k===cur?'cur ':'')+(st.solved[k]?'done ':'')+(d?'':'locked');
  li.innerHTML=st.solved[k]?`✔ <b>${x.answer}</b> — ${mask(x.street)}`:(d?`${x.clue} <i>(${x.cells.length})</i>`:'🔒 Hidden in the fog — solve a street that crosses it.');
  if(d) li.onclick=()=>select(k); ol.appendChild(li);});
}
// ---------- init
lightWord(START,60,false);
W.forEach((w,k)=>{ if(st.solved[k]) solve(k,true); });
cur=allDone()?START:(st.solved[START]?(W.findIndex((_,k)=>discovered(k)&&!st.solved[k])):START);
act=firstOpen(cur,0);
render();
setVB(boxOf(W.map((_,k)=>k).filter(discovered),70));
requestAnimationFrame(()=>focusWord(cur));
window.addEventListener('resize',()=>focusWord(cur));
window.KSC={data:DATA,state:()=>st,select,type,solved:()=>st.solved.slice(),get cur(){return cur}};
})();
</script>
