name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm sample
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Export the iOS bundle
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --output-dir /tmp/crossings-export
